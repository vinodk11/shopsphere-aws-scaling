# Trivy SCA & Dependency Scanner Configuration for ShopSphere
# Scans npm dependencies for known CVEs and supply chain vulnerabilities.

severity:
  - HIGH
  - CRITICAL

vuln-type:
  - library

ignore-unfixed: false

format: table

exit-code: 1

timeout: 10m

scan:
  file-patterns:
    - "**/package.json"
    - "**/package-lock.json"

vulnerability:
  ignore:
    # Whitelisted CVEs with low risk or dev-only dependencies can be listed here with rationale
    # - ID: CVE-2023-XXXX
    #   statement: "Mitigated by runtime WAF and sanitized inputs"
