apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopsphere-stage9
  labels:
    app: order-service
    service: order
    stage: "stage-9"
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
