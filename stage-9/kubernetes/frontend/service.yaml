apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: shopsphere-stage9
  labels:
    app: frontend-service
    stage: "stage-9"
spec:
  type: NodePort
  selector:
    app: frontend-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
