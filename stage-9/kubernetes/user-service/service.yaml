apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shopsphere-stage9
  labels:
    app: user-service
    service: user
    stage: "stage-9"
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      nodePort: 30083
