# Gitleaks Configuration for ShopSphere DevSecOps (Stage 7)
# Enforces pre-commit and pipeline secret scanning to prevent credential leakage.

title = "ShopSphere Gitleaks Rules"

[extend]
# Inherit standard default rules from Gitleaks base configuration
useDefault = true

[allowlist]
description = "ShopSphere global allowlist for test templates and examples"
paths = [
  '''\.terraform\.lock\.hcl$''',
  '''\.example$''',
  '''README\.md$''',
  '''schema\.sql$''',
  '''terraform\.tfvars\.example$'''
]
regexes = [
  '''ShopSphere2026SecurePass!''',
  '''example-secret-key'''
]

# Custom Rules
[[rules]]
id = "shopsphere-aws-access-key"
description = "Identified possible AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "AWS"]
severity = "CRITICAL"

[[rules]]
id = "shopsphere-aws-secret-key"
description = "Identified possible AWS Secret Access Key"
regex = '''(?i)aws_(?:secret_)?(?:access_)?key(?:\s*[:=]\s*["']?([A-Za-z0-9\/+=]{40})["']?)'''
secretGroup = 1
tags = ["key", "AWS"]
severity = "CRITICAL"

[[rules]]
id = "shopsphere-private-key"
description = "Identified unencrypted Private Cryptographic Key"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]+PRIVATE KEY-----'''
tags = ["key", "crypto"]
severity = "CRITICAL"

[[rules]]
id = "shopsphere-generic-secret"
description = "Identified generic high-entropy API key or secret token"
regex = '''(?i)(?:api_key|apikey|secret|password|auth_token|token)\s*[:=]\s*["']([A-Za-z0-9_\-]{24,})["']'''
secretGroup = 1
tags = ["key", "token"]
severity = "HIGH"
